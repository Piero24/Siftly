name: ✨ Feature Request
description: Suggest a new feature or improvement for Siftly
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! We'd love to hear your ideas.

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: Which part of Siftly does this relate to?
      options:
        - Dashboard & Analytics
        - Job Application Management
        - Interview Tracking
        - LinkedIn Scraper
        - Chrome Extension (Popup)
        - Settings & Configuration
        - Import / Export
        - Authentication
        - Docker / Self-Hosting
        - Documentation
        - CI/CD & DevOps
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Why is it needed?
      placeholder: I often find myself needing to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you'd like this feature to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Screenshots
      description: Optional visual references for UI changes.
    validations:
      required: false
